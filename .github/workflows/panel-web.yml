name: panel-web

# 管理面板前端（web/）检查：
#   - 类型检查 + ESLint（零警告）+ vitest 单元测试 + 构建（npm run build 一步跑完）
#   - 构建产物 internal/panel/dist 是提交进仓库的（go build 只需 Go）：重新构建后必须与仓库里的一致，
#     防止改了 web/ 忘了重新构建，或手改了 dist。构建结果是确定的（同源码同依赖逐字节相同）。
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "internal/panel/dist/**"
      - ".github/workflows/panel-web.yml"
  pull_request:
    paths:
      - "web/**"
      - "internal/panel/dist/**"
      - ".github/workflows/panel-web.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: 构建产物必须与仓库一致
        working-directory: .
        run: |
          if [ -n "$(git status --porcelain -- internal/panel/dist)" ]; then
            echo "::error::internal/panel/dist 与 web/ 源码不一致：请在 web/ 下运行 npm run build 并提交 internal/panel/dist"
            git status --porcelain -- internal/panel/dist
            exit 1
          fi
