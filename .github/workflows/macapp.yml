name: macapp

on:
  push:
    tags:
      - 'app-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build universal app + DMG
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#app-v}"
          else
            VERSION="0.0.0-dev"
          fi
          APP_VERSION="$VERSION" bash macapp/build.sh --dmg
          cd macapp/dist && shasum -a 256 *.dmg > SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorkBuddy2API-dmg
          path: macapp/dist/

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            macapp/dist/*.dmg
            macapp/dist/SHA256SUMS.txt
          body: |
            ## 怎么用（3 步）

            **1. 下载并安装**

            下载下面的 `WorkBuddy2API-1.0.0-universal.dmg`，双击打开，把 `WorkBuddy2API.app` 拖进「应用程序」文件夹。

            **2. 第一次打开时允许一次**

            双击 App 会提示「Apple 无法验证」，这是正常的（个人开发者没有购买苹果的签名证书）。

            - 点「完成」
            - 打开 **系统设置 → 隐私与安全性**，向下找到「安全性」，点「**仍要打开**」，输入开机密码
            - 再双击 App 就能打开，以后不会再问

            **3. 选择网关目录**

            App 本身是「遥控器」，真正的服务是 `wb2api`。如果打开后提示找不到 `wb2api`，点橙色提示条上的「**选择网关目录…**」，选中放有 `wb2api` 的文件夹即可（只需一次）。

            ## 打开之后

            - 屏幕右上角菜单栏会出现一个小图标，**这就是它**。关掉主窗口服务不会停，图标还在 = 服务在跑
            - 点图标可以：启动 / 停止服务、打开管理面板、复制 API 配置
            - 图标**变红闪烁** = 账号池里没有可用账号（冷却中 / 已禁用），打开管理面板看一下
            - 想开机自动启动：勾选「自启动」
            - 想彻底退出：点图标 →「退出」

            ## 还需要什么

            - macOS **15.0 或更高**（Apple 芯片、Intel 都支持）
            - 网关程序 `wb2api`：到[上游 Releases](https://github.com/linguo2625469/workbuddy2api-panel/releases/latest) 下载 `darwin-arm64`（M 系列芯片）或 `darwin-amd64`（Intel），解压出 `wb2api` 放到任意文件夹，再用第 3 步选中该文件夹

            更多说明见 [macapp/README.md](https://github.com/${{ github.repository }}/blob/main/macapp/README.md)。
